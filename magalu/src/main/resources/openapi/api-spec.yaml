openapi: 3.0.3

info:
  title: Magalu Checkout & Payment API
  description: |
    **Reactive Checkout and Payment Platform**
    
    Professional checkout and payment backend developed with Java and Spring Boot, using reactive programming with Spring WebFlux and MySQL (R2DBC).
    
    ## Features
    - JWT-based authentication with refresh tokens
    - Role-based access control (RBAC)
    - Ownership validation (users can only access their own data)
    - Reactive non-blocking operations
    - RESTful API design
    
    ## Security
    Most endpoints require JWT Bearer token authentication. Use the `/api/auth/login` endpoint to obtain tokens.
    
    ## Roles
    - **CUSTOMER**: End customer with limited access to own data
    - **MERCHANT_ADMIN**: Store administrator with extended permissions
    - **SUPPORT**: Technical support with full access
    - **SYSTEM**: Internal system processes
  version: 1.0.0
  contact:
    name: Magalu Development Team
    email: dev@magalu.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.magalu.com
    description: Production server

tags:
  - name: Authentication
    description: User authentication and token management
  - name: Customers
    description: Customer management endpoints (requires authentication)

paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: |
        Register a new user in the system. After registration, use the `/login` endpoint to obtain authentication tokens.
        
        **Note:** This endpoint does NOT return tokens. You must login after registration.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              validRequest:
                summary: Valid registration request
                value:
                  email: user@example.com
                  password: SecurePass123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                success:
                  summary: Successful registration
                  value:
                    id: 1
                    email: user@example.com
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  summary: Validation failed
                  value:
                    timestamp: "2026-02-09T10:30:00"
                    status: 400
                    error: Bad Request
                    message: Validation failed
                    path: /api/auth/register
                    validationErrors:
                      - field: email
                        message: Email must be valid
                      - field: password
                        message: Password must be between 5 and 255 characters
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userExists:
                  summary: Email already registered
                  value:
                    timestamp: "2026-02-09T10:30:00"
                    status: 409
                    error: Conflict
                    message: Email already registered
                    path: /api/auth/register
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login and obtain tokens
      description: |
        Authenticate user and receive access and refresh tokens.
        
        - **Access Token**: Short-lived token (5 minutes) used for API requests
        - **Refresh Token**: Long-lived token (24 hours) used to obtain new access tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              validLogin:
                summary: Valid login request
                value:
                  email: user@example.com
                  password: SecurePass123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  summary: Successful login
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsImVtYWlsIjoidXNlckBleGFtcGxlLmNvbSIsInJvbGVzIjpbIkNVU1RPTUVSIl0sInR5cGUiOiJhY2Nlc3MiLCJpYXQiOjE2NDQzOTYwMDAsImV4cCI6MTY0NDM5NjMwMH0.signature
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsImVtYWlsIjoidXNlckBleGFtcGxlLmNvbSIsInR5cGUiOiJyZWZyZXNoIiwiaWF0IjoxNjQ0Mzk2MDAwLCJleHAiOjE2NDQ0ODI0MDB9.signature
                    expiresIn: 3600
                    tokenType: Bearer
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  summary: Wrong email or password
                  value:
                    timestamp: "2026-02-09T10:30:00"
                    status: 401
                    error: Unauthorized
                    message: Invalid credentials
                    path: /api/auth/login
                disabledUser:
                  summary: User account disabled
                  value:
                    timestamp: "2026-02-09T10:30:00"
                    status: 401
                    error: Unauthorized
                    message: User is disabled
                    path: /api/auth/login
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout and revoke refresh token
      description: |
        Logout user by revoking the refresh token. The access token will remain valid until it expires (5 minutes).
        
        **Best Practice:** Client should delete stored tokens immediately after logout.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            examples:
              validRequest:
                summary: Valid logout request
                value:
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '204':
          description: Logout successful (refresh token revoked)
        '404':
          description: Refresh token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tokenNotFound:
                  summary: Token not found in database
                  value:
                    timestamp: "2026-02-09T10:30:00"
                    status: 404
                    error: Not Found
                    message: Token not found
                    path: /api/auth/logout
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: |
        Use a valid refresh token to obtain a new access token and refresh token pair.
        
        **Note:** The old refresh token will be revoked. Always use the new tokens returned in the response.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            examples:
              validRequest:
                summary: Valid refresh token request
                value:
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  summary: New tokens issued
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.new_access_token...
                    refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.new_refresh_token...
                    expiresIn: 3600
                    tokenType: Bearer
        '401':
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  summary: Token is invalid or expired
                  value:
                    timestamp: "2026-02-09T10:30:00"
                    status: 401
                    error: Unauthorized
                    message: Refresh token expired or revoked
                    path: /api/auth/refresh-token
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/customers:
    post:
      tags:
        - Customers
      summary: Create new customer
      description: |
        Create a new customer associated with the authenticated user.
        
        **Business Rules:**
        - Customer is automatically associated with the authenticated user's ID
        - Document number must be unique across all customers
        - Requires valid JWT access token
      operationId: createCustomer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
            examples:
              cpfCustomer:
                summary: Customer with CPF
                value:
                  name: João Silva
                  email: joao@example.com
                  documentType: CPF
                  documentNumber: "12345678901"
                  phoneNumber: "11987654321"
              cnpjCustomer:
                summary: Customer with CNPJ
                value:
                  name: Empresa LTDA
                  email: contato@empresa.com
                  documentType: CNPJ
                  documentNumber: "12345678000190"
                  phoneNumber: "+55-11-3456-7890"
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              examples:
                success:
                  summary: Customer created
                  value:
                    id: 1
                    name: João Silva
                    email: joao@example.com
                    document:
                      documentType: CPF
                      documentNumber: "12345678901"
                    phoneNumber: "11987654321"
                    createdAt: "2026-02-09T10:30:00"
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  summary: Invalid data
                  value:
                    timestamp: "2026-02-09T10:30:00"
                    status: 400
                    error: Bad Request
                    message: Validation failed
                    path: /api/customers
                    validationErrors:
                      - field: documentNumber
                        message: Document number must contain only numbers
                      - field: email
                        message: Email must be valid
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Document number already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateDocument:
                  summary: Document already registered
                  value:
                    timestamp: "2026-02-09T10:30:00"
                    status: 409
                    error: Conflict
                    message: Document number already exists
                    path: /api/customers
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/customers/{id}:
    get:
      tags:
        - Customers
      summary: Get customer by ID
      description: |
        Retrieve customer details by ID.
        
        **Authorization Rules:**
        - **CUSTOMER**: Can only view their own customer data
        - **MERCHANT_ADMIN**: Can view all customers
        - **SUPPORT**: Can view all customers
        
        Returns 403 Forbidden if user tries to access another user's customer.
      operationId: getCustomerById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Customer ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              examples:
                success:
                  summary: Customer details
                  value:
                    id: 1
                    name: João Silva
                    email: joao@example.com
                    document:
                      documentType: CPF
                      documentNumber: "12345678901"
                    phoneNumber: "11987654321"
                    createdAt: "2026-02-09T10:30:00"
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (user trying to access another user's customer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notAuthorized:
                  summary: Access denied
                  value:
                    timestamp: "2026-02-09T10:30:00"
                    status: 403
                    error: Forbidden
                    message: You are not authorized to access this customer
                    path: /api/customers/1
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Customer doesn't exist
                  value:
                    timestamp: "2026-02-09T10:30:00"
                    status: 404
                    error: Not Found
                    message: Customer not found
                    path: /api/customers/1
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Customers
      summary: Update customer
      description: |
        Update customer details (partial update).
        
        **Authorization Rules:**
        - **CUSTOMER**: Can only update their own customer data
        - **MERCHANT_ADMIN**: Can update all customers
        - **SUPPORT**: Can update all customers
        
        **Note:** Document number cannot be changed (use DELETE + POST to change document).
      operationId: updateCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Customer ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
            examples:
              updateNameAndEmail:
                summary: Update name and email
                value:
                  name: João Silva Santos
                  email: joao.santos@example.com
                  phoneNumber: "11987654321"
              updatePhone:
                summary: Update only phone
                value:
                  name: João Silva
                  email: joao@example.com
                  phoneNumber: "11999999999"
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              examples:
                success:
                  summary: Updated customer
                  value:
                    id: 1
                    name: João Silva Santos
                    email: joao.santos@example.com
                    document:
                      documentType: CPF
                      documentNumber: "12345678901"
                    phoneNumber: "11987654321"
                    createdAt: "2026-02-09T10:30:00"
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (user trying to update another user's customer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notAuthorized:
                  summary: Access denied
                  value:
                    timestamp: "2026-02-09T10:30:00"
                    status: 403
                    error: Forbidden
                    message: You are not authorized to update this customer
                    path: /api/customers/1
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Customers
      summary: Delete customer
      description: |
        Delete customer account (hard delete).
        
        **Authorization Rules:**
        - **CUSTOMER**: Can only delete their own customer account
        - **SUPPORT**: Can delete any customer account
        
        **Warning:** This is a permanent operation and cannot be undone.
        
        **Future Consideration:** Implement soft delete for data retention and LGPD compliance.
      operationId: deleteCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Customer ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: Customer deleted successfully (no content)
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (user trying to delete another user's customer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notAuthorized:
                  summary: Access denied
                  value:
                    timestamp: "2026-02-09T10:30:00"
                    status: 403
                    error: Forbidden
                    message: You are not authorized to delete this customer
                    path: /api/customers/1
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token authentication.
        
        **How to use:**
        1. Call `/api/auth/login` to get tokens
        2. Use the `accessToken` in the Authorization header: `Authorization: Bearer <accessToken>`
        3. When access token expires, use `/api/auth/refresh-token` to get new tokens

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address (must be unique)
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 5
          maxLength: 255
          description: User password (will be hashed)
          example: SecurePass123

    RegisterResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: User ID
          example: 1
        email:
          type: string
          format: email
          description: User email address
          example: user@example.com

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 5
          maxLength: 255
          description: User password
          example: SecurePass123

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (expires in 5 minutes)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsImVtYWlsIjoidXNlckBleGFtcGxlLmNvbSIsInJvbGVzIjpbIkNVU1RPTUVSIl0sInR5cGUiOiJhY2Nlc3MiLCJpYXQiOjE2NDQzOTYwMDAsImV4cCI6MTY0NDM5NjMwMH0.signature
        refreshToken:
          type: string
          description: JWT refresh token (expires in 24 hours)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsImVtYWlsIjoidXNlckBleGFtcGxlLmNvbSIsInR5cGUiOiJyZWZyZXNoIiwiaWF0IjoxNjQ0Mzk2MDAwLCJleHAiOjE2NDQ0ODI0MDB9.signature
        expiresIn:
          type: integer
          format: int64
          description: Access token expiration time in seconds
          example: 3600
        tokenType:
          type: string
          description: Token type (always "Bearer")
          example: Bearer

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Valid refresh token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    CustomerRequest:
      type: object
      required:
        - name
        - email
        - documentType
        - documentNumber
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          description: Customer full name
          example: João Silva
        email:
          type: string
          format: email
          description: Customer email address
          example: joao@example.com
        documentType:
          $ref: '#/components/schemas/DocumentType'
        documentNumber:
          type: string
          minLength: 11
          maxLength: 18
          pattern: '^[0-9]+$'
          description: Document number (only digits, 11-18 characters)
          example: "12345678901"
        phoneNumber:
          type: string
          maxLength: 20
          pattern: '^[0-9+\-() ]*$'
          description: Customer phone number (optional)
          example: "11987654321"

    CustomerUpdateRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          description: Customer full name
          example: João Silva Santos
        email:
          type: string
          format: email
          description: Customer email address
          example: joao.santos@example.com
        phoneNumber:
          type: string
          maxLength: 20
          pattern: '^[0-9+\-() ]*$'
          description: Customer phone number (optional)
          example: "11999999999"

    CustomerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Customer ID
          example: 1
        name:
          type: string
          description: Customer full name
          example: João Silva
        email:
          type: string
          format: email
          description: Customer email address
          example: joao@example.com
        document:
          $ref: '#/components/schemas/Document'
        phoneNumber:
          type: string
          description: Customer phone number
          example: "11987654321"
        createdAt:
          type: string
          format: date-time
          description: Customer creation timestamp
          example: "2026-02-09T10:30:00"

    Document:
      type: object
      properties:
        documentType:
          $ref: '#/components/schemas/DocumentType'
        documentNumber:
          type: string
          description: Document number
          example: "12345678901"

    DocumentType:
      type: string
      enum:
        - CPF
        - CNPJ
        - CNH
      description: |
        Document type:
        - **CPF**: Cadastro de Pessoa Física (individual tax ID, 11 digits)
        - **CNPJ**: Cadastro Nacional de Pessoa Jurídica (corporate tax ID, 14 digits)
        - **CNH**: Carteira Nacional de Habilitação (driver's license)

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: "2026-02-09T10:30:00"
        status:
          type: integer
          description: HTTP status code
          example: 400
        error:
          type: string
          description: HTTP status text
          example: Bad Request
        errorCode:
          type: string
          description: Application-specific error code (optional)
          example: VALIDATION_ERROR
        message:
          type: string
          description: Error message
          example: Validation failed
        path:
          type: string
          description: Request path that generated the error
          example: /api/customers
        validationErrors:
          type: array
          description: List of validation errors (only present for 400 Bad Request)
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      properties:
        field:
          type: string
          description: Field name that failed validation
          example: email
        message:
          type: string
          description: Validation error message
          example: Email must be valid
